<div class="page">
  <div class="page-header">
    <h2>Outil des bibliothèques</h2>
  </div>

  <div class="tool-grid">
    <a class="tool-btn" routerLink="/outils/comparaison">
      <svg class="tool-icon" viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="currentColor"
           stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3"></path>
        <path d="M15 3h3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-3"></path>
        <path d="M12 2v20"></path>
        <path d="M6.5 9h2M6.5 13h2M15.5 9h2M15.5 13h2"></path>
      </svg>
      <span class="tool-label">Comparer des bibliothèques</span>
    </a>

    <a class="tool-btn" routerLink="/outils/export">
      <svg class="tool-icon" viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="currentColor"
           stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 15V3"></path>
        <path d="M7.5 7.5 12 3l4.5 4.5"></path>
        <path d="M4 14v5a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"></path>
      </svg>
      <span class="tool-label">Exporter bibliothèque</span>
    </a>

    <a class="tool-btn" routerLink="/outils/import">
      <svg class="tool-icon" viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="currentColor"
           stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3v12"></path>
        <path d="M7.5 10.5 12 15l4.5-4.5"></path>
        <path d="M4 14v5a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"></path>
      </svg>
      <span class="tool-label">Importer bibliothèque</span>
    </a>
  </div>

  <section class="tool-section" aria-labelledby="tool-section-app">
    <h3 id="tool-section-app" class="tool-section-title">Application</h3>

    <div class="tool-grid">
      <button type="button" class="tool-btn" (click)="dialogs.openAbout()">
        <svg class="tool-icon" viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="currentColor"
             stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M12 11v5.5"></path>
          <circle cx="12" cy="7.8" r="0.6" fill="currentColor"></circle>
        </svg>
        <span class="tool-label">À propos</span>
      </button>

      <button type="button" class="tool-btn" (click)="dialogs.openSettings()">
        <svg class="tool-icon" viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="currentColor"
             stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        <span class="tool-label">Paramètres</span>
      </button>
    </div>
  </section>
</div>
